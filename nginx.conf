# shadcn-chat 的 nginx 站点配置
# 由 Dockerfile COPY 到 /etc/nginx/conf.d/default.conf

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 不暴露 nginx 版本号
    server_tokens off;

    # ---------- 压缩 ----------
    # woff2/图片本身已压缩，不必再走 gzip；字体已不在项目中
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ---------- 安全头 ----------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    # ---------- 带内容哈希的构建产物：可长期强缓存 ----------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 命中缓存时不再回源校验
        access_log off;
        try_files $uri =404;
    }

    # ---------- 入口 HTML：必须每次校验，否则发版后用户拿到旧资源引用 ----------
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # ---------- 其他静态文件（favicon / icons.svg 等）----------
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------- SPA 回落：前端路由刷新不 404 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 兜底错误页也回落到入口，避免出现 nginx 白页
    error_page 404 /index.html;
}
